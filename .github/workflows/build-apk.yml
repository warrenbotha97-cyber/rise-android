name: Build RISE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Write the RISE launcher icons (legacy, round and adaptive layers)
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/pip install --quiet pillow
          .icon-venv/bin/python scripts/make_icons.py
          find android/app/src/main/res -name 'ic_launcher*' | sort

      - name: Patch manifest (speech engine visibility + notification permission)
        run: |
          python3 - <<'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.intent.action.TTS_SERVICE" not in s:
              q = '    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n'
              s = s.replace("</manifest>", q + "</manifest>")
          for name in (
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ):
              if name not in s:
                  perm = '    <uses-permission android:name="%s" />\n' % name
                  s = s.replace("</manifest>", perm + "</manifest>")
          open(p, "w").write(s)
          EOF

      - name: Sync Capacitor config and plugins
        run: npx cap sync android

      - name: Show manifest permissions and queries (for the log)
        run: grep -nE "uses-permission|queries|TTS_SERVICE" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RISE.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RISE-apk
          path: RISE.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RISE APK build ${{ github.run_number }}
          files: RISE.apk
